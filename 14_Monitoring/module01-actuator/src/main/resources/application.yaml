spring:
  application:
    name: module01-actuator
  datasource:
    url: jdbc:mysql://localhost:3306/popular_shop
    username: wanted
    password: wanted
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

logging:
  level:
    root: info

# 엑츄에이터는 HTTP 를 통해 APP 운영 정보를 제공한다.
# 개발 과정에서는 모든 엔드포인트를 공개할 수 있지만
# 추후 운영 환경에서는 APP 민감 정보들이 노출 될 수 있기 때문에
# 노출 시킬 EndPoint 를 정의한다.
management:
  endpoints:
    web:
      exposure:
        # shop 은 custom endpoint 이다.
        # prometheus 는 build.gradle 에 추가한 프로메테우스 구현체 결과를
        # 확인할 수 있는 endpoint 이다.
        include: health, info, metrics, shop, prometheus
  metrics:
    distribution:
      # percentiles-histogram 을 켜면 Micrometer 가 _bucket{le=...} 시계열을 내보낸다.
      # 이 bucket 이 있어야 Prometheus 의 histogram_quantile() 로 p90/p95/p99 를 계산할 수 있다.
      # 켜지 않으면 Timer 는 count/sum/max 만 제공하므로 percentile 을 볼 수 없다.
      percentiles-histogram:
        http.server.requests: true
        shop.products.popular.query.duration: true
        shop.orders.creation.duration: true
        shop.payment.duration: true